[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["soo"]

[project]
name = "self-over-other"
version = "1.0.0"
description = "Does a model's honesty degrade as the user appears more distressed?"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "anthropic>=0.60.0",
    "openai>=1.60.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
# Only needed for `soo whitebox`. Requires an accelerator with enough memory for
# the probe model in fp16 (~15 GB for the 7B default).
whitebox = [
    "torch>=2.4.0",
    # 5.0 is a floor, not a preference: `from_pretrained(dtype=...)` was named
    # `torch_dtype` before v5.
    "transformers>=5.0.0",
    "accelerate>=0.34.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
soo = "soo.cli:main"

[tool.ruff]
line-length = 120
lint.select = ["E", "W", "F", "I", "C", "B"]
lint.ignore = ["B008", "C901", "E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["soo"]
force-sort-within-sections = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
